<!doctype html>
<html lang="ko">
<head>
<script src="assets/i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Workout Land</title>
<meta name="description" content="운동할수록 자라는 나만의 섬, My Workout Land 시연">
<meta name="theme-color" content="#F5F2EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="devtools/devtools.css">
</head>
<body>
<main class="stage">
  <header class="top">
    <h1>My Workout Land</h1>
    <button class="reset" id="reset" type="button">처음부터 다시</button>
  </header>

  <div class="phones">
  <div class="demo demo-member">
    <p class="role">회원</p>
    <div class="phone">
      <i class="phone-rim" aria-hidden="true"></i>
      <div class="screen">
        <div class="phone-status" aria-hidden="true">
          <span class="phone-status-clock clock">9:41</span>
          <i class="phone-status-camera"></i>
          <span class="phone-status-icons">
            <svg class="phone-status-signal" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
            <svg class="phone-status-wifi" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.1-1.2A10.4 10.4 0 0 0 8.5.6C5.7.6 3.1 1.7 1.2 3.6l1.1 1.2a8.8 8.8 0 0 1 6.2-2.5Zm0 3.7c1.4 0 2.7.5 3.7 1.5l1.2-1.2a7 7 0 0 0-9.8 0l1.2 1.2c1-1 2.3-1.5 3.7-1.5Zm0 3.5c-.7 0-1.3.3-1.7.7l1.7 1.8 1.7-1.8c-.4-.4-1-.7-1.7-.7Z"/></svg>
            <svg class="phone-status-battery" viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="8" rx="1.7"/><path d="M25 4v4c.8-.3 1.5-1.1 1.5-2S25.8 4.3 25 4Z" opacity=".5"/></svg>
          </span>
        </div>
        <iframe id="game" src="land/index.html" title="My Workout Land 게임" allow="accelerometer; gyroscope"></iframe>
        <div class="booking-layer" id="booking-layer" inert>
          <button class="booking-back" id="booking-back" type="button" aria-label="섬으로 돌아가기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </button>
          <p class="booking-title" id="booking-title"></p>
          <iframe id="booking" title="회원 화면"></iframe>
        </div>
        <iframe id="member-entry" title="회원 로그인" hidden></iframe>
        <div class="member-dialog" id="notice-dialog" role="dialog" aria-modal="true" aria-labelledby="notice-dialog-title" hidden>
          <div class="member-dialog-card notice-dialog-card">
            <h2 id="notice-dialog-title"></h2>
            <p id="notice-dialog-body"></p>
            <button type="button" id="notice-dialog-close">확인</button>
          </div>
        </div>
        <div class="member-dialog" id="member-dialog" role="alertdialog" aria-modal="true" aria-labelledby="member-dialog-title" aria-describedby="member-dialog-body" hidden>
          <div class="member-dialog-card">
            <h2 id="member-dialog-title"></h2>
            <p id="member-dialog-body"></p>
            <div class="member-dialog-actions">
              <button type="button" id="member-dialog-cancel">취소</button>
              <button type="button" id="member-dialog-ok">확인</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="demo demo-partner">
    <p class="role">제휴사</p>
    <div class="phone">
      <i class="phone-rim" aria-hidden="true"></i>
      <div class="screen">
        <div class="phone-status" aria-hidden="true">
          <span class="phone-status-clock clock">9:41</span>
          <i class="phone-status-camera"></i>
          <span class="phone-status-icons">
            <svg class="phone-status-signal" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
            <svg class="phone-status-wifi" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.1-1.2A10.4 10.4 0 0 0 8.5.6C5.7.6 3.1 1.7 1.2 3.6l1.1 1.2a8.8 8.8 0 0 1 6.2-2.5Zm0 3.7c1.4 0 2.7.5 3.7 1.5l1.2-1.2a7 7 0 0 0-9.8 0l1.2 1.2c1-1 2.3-1.5 3.7-1.5Zm0 3.5c-.7 0-1.3.3-1.7.7l1.7 1.8 1.7-1.8c-.4-.4-1-.7-1.7-.7Z"/></svg>
            <svg class="phone-status-battery" viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="8" rx="1.7"/><path d="M25 4v4c.8-.3 1.5-1.1 1.5-2S25.8 4.3 25 4Z" opacity=".5"/></svg>
          </span>
        </div>
        <iframe id="partner" src="partner/index.html" title="My Workout Land 제휴사 화면"></iframe>
      </div>
    </div>
  </div>
  </div>
  <section class="desk" id="devtools" aria-label="My Workout Land 디자인 도구"></section>
</main>
<script src="land/land-rules.js"></script>
<script src="host.js"></script>
<script src="devtools/devtools.js"></script>
</body>
</html>
